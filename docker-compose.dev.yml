# Local development stack: PostgreSQL 16, MinIO (S3-compatible object storage), Mailpit (SMTP sink).
# The API and worker run with `make api` / `make worker` on the host by default; the `app`
# profile runs them in containers instead (`docker compose --profile app up`).
name: mizan-v2

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan
      POSTGRES_DB: mizan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan -d mizan"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mizan
      MINIO_ROOT_PASSWORD: mizan-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mizan mizan-secret &&
      mc mb --ignore-existing local/mizan-documents &&
      mc mb --ignore-existing local/mizan-attachments &&
      echo buckets ready"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["api"]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://mizan:mizan@db:5432/mizan
      S3_ENDPOINT_URL: http://minio:9000
      EMAIL_HOST: mailpit
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["worker"]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://mizan:mizan@db:5432/mizan
      S3_ENDPOINT_URL: http://minio:9000
      EMAIL_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  minio:
