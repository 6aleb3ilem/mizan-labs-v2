name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, import-linter, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mizan
          POSTGRES_PASSWORD: mizan
          POSTGRES_DB: mizan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mizan -d mizan"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://mizan:mizan@127.0.0.1:5432/mizan
      MIZAN_ENV: test
      SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 fonts-dejavu-core fonts-noto-core
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --frozen --python 3.12
      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        working-directory: backend
        run: uv run mypy mizan
      - name: Import contracts
        working-directory: backend
        run: uv run lint-imports
      - name: Tests
        working-directory: backend
        run: uv run pytest
      - name: OpenAPI export (contract artifact)
        working-directory: backend
        run: uv run python manage.py export_openapi ../openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  frontend:
    name: Front-end (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build test

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push; the deploy workflow pushes to Artifact Registry)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: mizan-labs/platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
